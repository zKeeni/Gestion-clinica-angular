<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">
      Recuperar Contraseña
    </h2>

    <div class="mb-4">
      <label for="codigo" class="block text-sm font-medium text-gray-700 mb-1"
        >Código de verificación se enviara al correo {{ correo }}</label
      >
    </div>

    <!-- Botón enviar código -->
    <div class="mb-4">
      <button
        type="button"
        (click)="enviarCodigo()"
        [disabled]="banderaenvio"
        class="w-full font-semibold py-2 rounded-lg transition duration-200 text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        Enviar código
      </button>
    </div>
    <form [formGroup]="form" autocomplete="off" (ngSubmit)="actualizarContrasenia()">
      <!-- Código de verificación -->
      <div class="mb-4">
        <label for="codigo" class="block text-sm font-medium text-gray-700 mb-1"
          >Código de verificación</label
        >
              <input type="text" style="display:none">

        <input
          formControlName="codigo"
          type="text"
   
          maxlength="4"
          placeholder="1234"
          autocomplete="off"
          pattern="\d{4}"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
      </div>

      <!-- Nueva contraseña -->
      <div class="mb-6">
        <label
          for="nuevaContrasenia"
          autocomplete="off"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Nueva contraseña</label
        >
        <input
          formControlName="nuevaContrasenia"
          type="password"
      
          placeholder="********"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
      </div>

      <!-- Botón aceptar -->
      <div>
        <button
          type="submit"
          class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition duration-200"
        >  Aceptar
        </button>
      </div>
    </form>
  </div>
</div>

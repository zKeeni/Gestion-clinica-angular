<form [formGroup]="formCita" (ngSubmit)="guardarCitas()">
  <div class="parent">
    <div class="div1">
      <h2 class="text-3xl font-bold text-center text-blue-800 mb-6 bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">
        AGENDAR CITA MÉDICA
      </h2>
    </div>
    <div class="div2">
      <label
        for="postal-code"
        class="block text-sm font-semibold text-gray-700 mb-2"
      >
        Buscar por No Cédula
      </label>

      <div class="flex items-center space-x-3 mb-4">
        <input
          formControlName="txtCedulaPaci"
          placeholder="Ingrese el número de cédula del paciente"
          minlength="10"
          maxlength="10"
          type="text"
          name="cedulaPac"
          id="cedulaPac"
          autocomplete="address-level2"
          class="flex-1 px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm"
        />

        <button
          (click)="buscarPacienteCedula()"
          type="button"
          class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 transform hover:scale-105"
        >
          Buscar
        </button>
      </div>
      <div
      *ngIf="
        formCita.get('txtCedulaPaci')?.invalid &&
        formCita.get('txtCedulaPaci')?.touched
      "
      class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg"
    >
      <small *ngIf="formCita.get('txtCedulaPaci')?.errors?.['required']" class="text-red-600 text-sm font-medium">
        * Dato obligatorio.
      </small>
    </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre</label>
        <input
          type="text"
          name="first-name"
          formControlName="txtNombrePaci"
          id="first-name"
          autocomplete="given-name"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Apellido</label>
        <input
          type="text"
          name="last-name"
          formControlName="txtApellidoPaci"
          id="last-name"
          autocomplete="given-name"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm"
        />
      </div>


      <div class="mb-4">
        <label for="region" class="block text-sm font-semibold text-gray-700 mb-2">Edad</label>
        <input
          formControlName="txtEdadPaci"
          type="text"
          name="first-name"
          id="first-name"
          autocomplete="given-name"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm"
        />
      </div>
    </div>
    <div class="div3">
      <div class="mb-4">
        <label for="selectEspecialidad" class="block text-sm font-semibold text-gray-700 mb-2">
          Seleccione la especialidad
        </label>
        <select
          formControlName="selectEspecialidad"
          name="selectEspecialidad"
          id="selectEspecialidad"
          (change)="onSelectChange($event)"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm appearance-none cursor-pointer"
          style="background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;4&quot; height=&quot;5&quot; viewBox=&quot;0 0 4 5&quot;><path fill=&quot;%23666&quot; d=&quot;M2 0L0 2h4zm0 5L0 3h4z&quot;/></svg>'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 0.75rem;"
        >
          <option value="" selected="true">Seleccione una especialidad</option>
          <option
            *ngFor="let especialidad of listaEspecialidades"
            [value]="especialidad.codigo"
          >
            {{ especialidad.nombre }}
          </option>
        </select>
      </div>

      <div class="mb-4">
        <label for="selectMedico" class="block text-sm font-semibold text-gray-700 mb-2">
          Seleccione al médico
        </label>
        <div class="relative">
          <select
            formControlName="selectMedico"
            name="selectMedico"
            id="selectMedico"
            (change)="onSelectChange($event)"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm appearance-none cursor-pointer"
            style="background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;4&quot; height=&quot;5&quot; viewBox=&quot;0 0 4 5&quot;><path fill=&quot;%23666&quot; d=&quot;M2 0L0 2h4zm0 5L0 3h4z&quot;/></svg>'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 0.75rem;"
          >
            <option *ngFor="let medico of listamedicos" [value]="medico.codigo">
             Dr. {{ medico.nombre }} {{medico.apellido}}
            </option>
          </select>
        </div>
        <div *ngIf="objhorario" class="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-lg">
          <span class="text-sm font-medium text-blue-800">
            <i class="fas fa-clock text-blue-600 mr-2"></i>
            Horario del médico: {{ objhorario?.hora_inicio }} - {{ objhorario?.hora_fin }}
          </span>
        </div>
      </div>
    </div>
    <div class="div4">
      <div *ngIf="horaCita && fechaCita" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <h3 class="text-sm font-semibold text-green-800 mb-2">
          <i class="fas fa-calendar-check text-green-600 mr-2"></i>
          Fecha seleccionada para la consulta
        </h3>
        <p class="text-green-700">{{ fechaCita }} - {{ horaCita }}</p>
      </div>

      <div class="mb-6">
        <label for="txtAntecedente" class="block text-sm font-semibold text-gray-700 mb-2">
          Antecedentes o síntomas con los que ingresa el paciente
        </label>
        <textarea
          id="txtAntecedente"
          formControlName="txtAntecedente"
          cols="30"
          rows="4"
          placeholder="Ingrese algún antecedente del paciente..."
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 hover:bg-white hover:shadow-sm resize-vertical"
        ></textarea>
      </div>

      <div class="mb-6">
        <full-calendar [options]="calendarOptions"></full-calendar>
      </div>

      <div class="flex items-center justify-end gap-x-4 pt-6 border-t border-gray-200">
        <a routerLink="../dashboard">
          <button type="button" class="px-6 py-2 text-sm font-semibold text-gray-600 hover:text-gray-800 transition-colors duration-200">
            <i class="fas fa-arrow-left mr-2"></i>
            Atrás
          </button>
        </a>
        <button
          type="submit"
          class="px-8 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-lg shadow-lg hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transform hover:scale-105 transition-all duration-200"
        >
          <i class="fas fa-calendar-plus mr-2"></i>
          Agendar Cita
        </button>
      </div>
    </div>
  </div>
</form>
